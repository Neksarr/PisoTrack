<!doctype html>
<html>
  <head>
    <script src="js/theme-init.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PisoTrack - Dashboard</title>
    <link rel="icon" href="pisotrack.png" />
    <!-- Styles extracted without changing cascade order. -->
    <link rel="stylesheet" href="css/transactions.css" />
    <link rel="stylesheet" href="mobile.css?v=20260818-5" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="pisotrack.png" alt="" />
          <h1>PisoTrack</h1>
        </div>
        <a class="nav-item" href="index.html"
          ><img src="homeicon.png" alt="" />Home</a
        ><a class="nav-item active" href="dashboard.html"
          ><img src="purchaseicon.png" alt="" />Dashboard</a
        ><a class="nav-item" href="reports.html"
          ><img src="reporticon.png" alt="" />Reports</a
        ><a class="nav-item" href="settings.html"
          ><img src="settingicon.png" alt="" />Settings</a
        >
        <div class="sidebar-bottom">PisoTrack Desktop</div>
      </aside>
      <main class="main">
        <div class="topbar">
          <h2>Dashboard</h2>
          <a class="user-box" href="settings.html"
            ><img id="topProfileImage" class="profile-avatar" src="profileicon.png" /><span id="userName">User</span></a
          >
        </div>
        <div class="transactions-greeting"><img id="transactionProfileImage" class="profile-avatar" src="profileicon.png" alt="Profile picture"><div class="transactions-greeting-copy"><strong id="transactionGreeting">Hello, User</strong><span>Here is your transaction history</span></div></div>
        <div class="filters">
          <button id="downloadAll" class="icon-download" type="button" aria-label="Download complete transaction history" title="Download complete transaction history"><img src="download.png" alt=""></button>
          <select id="category" class="select">
            <option>All</option></select
          ><select id="range" class="select">
            <option>This Month</option>
            <option>Last 3 Months</option>
            <option>Last 6 Months</option>
            <option>Last Year</option></select
          ><input
            id="searchTx"
            class="input"
            type="search"
            placeholder="Search transactions"
            aria-label="Search transactions"
          />
          <div
            id="net"
            class="balance-chip skeleton"
            tabindex="0"
            aria-label="Remaining Balance"
          >
            ₱0
          </div>
        </div>
        <section class="panel">
          <div id="list" aria-busy="true"><div class="skeleton skeleton-date" aria-hidden="true"></div><div class="skeleton skeleton-row" aria-hidden="true"></div><div class="skeleton skeleton-row" aria-hidden="true"></div><div class="skeleton skeleton-row" aria-hidden="true"></div><div class="skeleton skeleton-row" aria-hidden="true"></div></div>
          <div class="actions">
            <button class="btn secondary" id="addExpense">+ Add Expense</button
            ><button class="btn" id="addIncome">+ Add Income</button>
          </div>
        </section>
      </main>
    </div>
    <div class="modal" id="modal">
      <div class="modal-box">
        <h3 id="modalTitle">Add Transaction</h3>
        <div id="txMessage" class="message error" role="alert"></div>
        <label>Title</label><input id="txTitle" class="input" /><label
          >Category</label
        ><input id="txCategory" class="input" /><label>Amount</label
        ><input id="txAmount" class="input" type="number" step="0.01" /><label
          >Date</label
        ><input id="txDate" class="input" type="date" />
        <div class="modal-actions">
          <button
            id="deleteTx"
            class="delete-transaction"
            type="button"
            aria-label="Delete transaction"
            title="Delete transaction"
            hidden
          >
            <img src="trash.png" alt="" /></button
          ><button id="downloadTx" class="icon-download" type="button" aria-label="Download transaction PDF" title="Download transaction PDF" hidden><img src="download.png" alt=""></button
          ><button class="btn secondary modal-hover-button" id="cancel">Cancel</button
          ><button class="btn modal-hover-button" id="save">Save</button>
        </div>
      </div>
    </div>
    <div class="modal" id="downloadRangeModal" role="dialog" aria-modal="true" aria-labelledby="downloadRangeTitle">
      <form class="modal-box" id="downloadRangeForm">
        <h3 id="downloadRangeTitle">Download Transactions</h3>
        <p class="download-range-help">Choose the transaction period to include.</p>
        <div id="downloadRangeMessage" class="message error" role="alert"></div>
        <fieldset class="download-range-options">
          <label><input type="radio" name="downloadRange" value="lastYear" checked><span>Last Year</span></label>
          <label><input type="radio" name="downloadRange" value="last6Months"><span>Last 6 Months</span></label>
          <label><input type="radio" name="downloadRange" value="last3Months"><span>Last 3 Months</span></label>
          <label><input type="radio" name="downloadRange" value="lastMonth"><span>Last Month</span></label>
        </fieldset>
        <div class="modal-actions"><button id="cancelDownloadRange" class="btn secondary modal-hover-button" type="button">Cancel</button><button id="confirmDownloadRange" class="btn modal-hover-button" type="submit">Download</button></div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="logout.js?v=20260818-7" defer></script>
    <script type="module" src="js/transactions.js"></script>
    <script src="js/sidebar-menu.js"></script>
  </body>
</html>
