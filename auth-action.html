<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PisoTrack - Email Action</title>
<link rel="icon" type="image/png" href="pisotrack.png">
<link rel="stylesheet" href="mobile.css">
<!-- Styles extracted without changing cascade order. -->
<link rel="stylesheet" href="css/auth-action.css">
</head>

<body>

<div class="wrapper">
    <main class="card">
        <img src="pisotrack.png" alt="PisoTrack Logo" class="logo">
        <div class="brand">PisoTrack</div>

        <div id="loadingSpinner" class="spinner"></div>
        <div id="actionIcon" class="icon-circle" hidden>✓</div>

        <h1 id="title">Verifying your request...</h1>

        <p id="description">
            Please wait while PisoTrack securely completes your account action.
        </p>

        <div id="statusBox" class="status-box"></div>

        <form id="resetForm" class="reset-form" hidden>
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
            <label for="confirmNewPassword">Confirm Password</label>
            <input id="confirmNewPassword" type="password" minlength="8" required autocomplete="new-password">
            <button id="updatePasswordButton" class="btn" type="submit">Update Password</button>
        </form>

        <div class="button-row">
            <a id="loginButton" class="btn" href="login.html" hidden>
                Go to Login
            </a>
        </div>

        <div class="small-note">
            Securely handled with Firebase Authentication.
        </div>
    </main>
</div>

<script type="module" src="js/auth-action.js"></script>

</body>
</html>
