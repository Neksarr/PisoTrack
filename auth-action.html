<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PisoTrack - Email Action</title>
<link rel="icon" type="image/png" href="pisotrack.png">
<link rel="stylesheet" href="mobile.css">
<style>
* {
    box-sizing: border-box;
}

:root {
    --blue: #4d6d87;
    --light-blue: #8cb3d2;
    --page: #eef1f4;
    --card: #ffffff;
    --text: #111111;
    --muted: #6f7881;
    --success-bg: #e8f6ee;
    --success-text: #226d45;
    --error-bg: #fdeaea;
    --error-text: #8f2f2f;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(140, 179, 210, .22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(77, 109, 135, .16), transparent 30%),
        var(--page);
    color: var(--text);

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.wrapper {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: min(520px, 100%);
    background: var(--card);
    border-radius: 28px;
    padding: 38px 34px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(34, 53, 70, .14);
    border: 1px solid rgba(77, 109, 135, .08);
}

.logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    margin: 0 auto 12px;
    display: block;
}

.brand {
    color: var(--blue);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
}

.icon-circle {
    width: 86px;
    height: 86px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(77, 109, 135, .11);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: var(--blue);
}

h1 {
    margin: 0 0 12px;
    font-size: 30px;
    line-height: 1.2;
}

p {
    margin: 0 auto;
    max-width: 390px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
}

.status-box {
    margin: 24px 0 0;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    display: none;
}

.status-box.show {
    display: block;
}

.status-box.success {
    background: var(--success-bg);
    color: var(--success-text);
}

.status-box.error {
    background: var(--error-bg);
    color: var(--error-text);
}

.button-row {
    display: flex;
    justify-content: center;
    margin-top: 26px;
}

.btn {
    border: 0;
    min-width: 180px;
    min-height: 52px;
    border-radius: 15px;
    padding: 13px 24px;
    background: var(--blue);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    transition: transform .15s ease, opacity .15s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn:active {
    transform: translateY(0);
}

.btn[hidden] {
    display: none;
}

.spinner {
    width: 34px;
    height: 34px;
    border: 4px solid rgba(77, 109, 135, .18);
    border-top-color: var(--blue);
    border-radius: 50%;
    margin: 6px auto 20px;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.small-note {
    margin-top: 18px;
    font-size: 12px;
    color: #98a0a7;
}

.reset-form { display: grid; gap: 12px; margin-top: 24px; text-align: left; }
.reset-form[hidden] { display: none; }
.reset-form label { font-weight: 700; }
.reset-form input { width: 100%; height: 50px; border: 1px solid #dfe4e7; border-radius: 13px; padding: 0 14px; font: inherit; outline: none; }
.reset-form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(77, 109, 135, .14); }

@media (max-width: 600px) {
    body {
        padding: 16px;
    }

    .card {
        border-radius: 22px;
        padding: 30px 22px;
    }

    .logo {
        width: 82px;
        height: 82px;
    }

    .icon-circle {
        width: 76px;
        height: 76px;
        font-size: 36px;
    }

    h1 {
        font-size: 26px;
    }

    p {
        font-size: 15px;
    }

    .btn {
        width: 100%;
        min-width: 0;
    }
}
</style>
</head>

<body>

<div class="wrapper">
    <main class="card">
        <img src="pisotrack.png" alt="PisoTrack Logo" class="logo">
        <div class="brand">PisoTrack</div>

        <div id="loadingSpinner" class="spinner"></div>
        <div id="actionIcon" class="icon-circle" hidden>✓</div>

        <h1 id="title">Verifying your request...</h1>

        <p id="description">
            Please wait while PisoTrack securely completes your account action.
        </p>

        <div id="statusBox" class="status-box"></div>

        <form id="resetForm" class="reset-form" hidden>
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
            <label for="confirmNewPassword">Confirm Password</label>
            <input id="confirmNewPassword" type="password" minlength="8" required autocomplete="new-password">
            <button id="updatePasswordButton" class="btn" type="submit">Update Password</button>
        </form>

        <div class="button-row">
            <a id="loginButton" class="btn" href="login.html" hidden>
                Go to Login
            </a>
        </div>

        <div class="small-note">
            Securely handled with Firebase Authentication.
        </div>
    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
    getAuth,
    applyActionCode,
    checkActionCode,
    verifyPasswordResetCode,
    confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBv2m_ciaohvHg7xCqkSWeTM_TfiphzMqw",
    authDomain: "pisotrack-e61d6.firebaseapp.com",
    projectId: "pisotrack-e61d6",
    storageBucket: "pisotrack-e61d6.firebasestorage.app",
    messagingSenderId: "492013865042",
    appId: "1:492013865042:web:e0ccf6e2bee76aab32f78b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");
const actionCode = params.get("oobCode");

const title = document.getElementById("title");
const description = document.getElementById("description");
const statusBox = document.getElementById("statusBox");
const loadingSpinner = document.getElementById("loadingSpinner");
const actionIcon = document.getElementById("actionIcon");
const loginButton = document.getElementById("loginButton");
const resetForm = document.getElementById("resetForm");
const newPassword = document.getElementById("newPassword");
const confirmNewPassword = document.getElementById("confirmNewPassword");
const updatePasswordButton = document.getElementById("updatePasswordButton");

function showResult(type, heading, message, icon = "✓") {
    loadingSpinner.hidden = true;
    actionIcon.hidden = false;
    actionIcon.textContent = type === "success" ? "✓" : icon;

    title.textContent = heading;
    description.textContent = message;
    loginButton.hidden = false;
    resetForm.hidden = true;

    if (type) {
        statusBox.className = "status-box show " + type;

        if (type === "success") {
            statusBox.textContent = "You can safely return to PisoTrack.";
        } else {
            statusBox.textContent =
                "If this link has expired, request a new one from PisoTrack.";
        }
    }
}

async function handleVerifyEmail() {
    try {
        await applyActionCode(auth, actionCode);

        showResult(
            "success",
            "Email Verified!",
            "Your email address has been verified successfully. You can now sign in to your PisoTrack account.",
            "✓"
        );
    } catch (error) {
        showResult(
            "error",
            "Verification Failed",
            "This verification link is invalid, expired, or has already been used.",
            "!"
        );
    }
}

async function handleRecoverEmail() {
    try {
        await checkActionCode(auth, actionCode);
        await applyActionCode(auth, actionCode);

        showResult(
            "success",
            "Email Restored",
            "Your previous email address has been restored successfully.",
            "✓"
        );
    } catch (error) {
        showResult(
            "error",
            "Recovery Failed",
            "This email recovery link is invalid or has expired.",
            "!"
        );
    }
}

async function handleResetPassword() {
    try {
        await verifyPasswordResetCode(auth, actionCode);

        showResult(
            "success",
            "Reset Link Verified",
            "Your password reset request is valid. Continue with the password reset page configured for PisoTrack.",
            "✓"
        );
    } catch (error) {
        showResult(
            "error",
            "Reset Link Invalid",
            "This password reset link is invalid or has expired.",
            "!"
        );
    }
}

async function handleResetPasswordForm() {
    try {
        await verifyPasswordResetCode(auth, actionCode);
        loadingSpinner.hidden = true;
        actionIcon.hidden = false;
        actionIcon.textContent = "✓";
        title.textContent = "Reset Password";
        description.textContent = "Enter and confirm your new password for your PisoTrack account.";
        statusBox.className = "status-box";
        loginButton.hidden = true;
        resetForm.hidden = false;
        newPassword.focus();
    } catch (error) {
        showResult("error", "Reset Link Invalid", "This password reset link is invalid or has expired.", "!");
    }
}

resetForm.addEventListener("submit", async event => {
    event.preventDefault();
    if (newPassword.value.length < 8) {
        statusBox.textContent = "Password must be at least 8 characters.";
        statusBox.className = "status-box show error";
        return;
    }
    if (newPassword.value !== confirmNewPassword.value) {
        statusBox.textContent = "Passwords do not match.";
        statusBox.className = "status-box show error";
        return;
    }
    updatePasswordButton.disabled = true;
    try {
        await confirmPasswordReset(auth, actionCode, newPassword.value);
        showResult("success", "Password Updated", "Your password has been updated successfully. You can now sign in to PisoTrack.", "✓");
    } catch (error) {
        statusBox.textContent = "This reset link is invalid, expired, or has already been used.";
        statusBox.className = "status-box show error";
    } finally {
        updatePasswordButton.disabled = false;
    }
});

async function run() {
    if (!mode || !actionCode) {
        showResult(
            "error",
            "Invalid Request",
            "PisoTrack could not find a valid Firebase account action in this link.",
            "!"
        );
        return;
    }

    if (mode === "verifyEmail") {
        await handleVerifyEmail();
    } else if (mode === "verifyAndChangeEmail") {
        try {
            await applyActionCode(auth, actionCode);
            showResult("success", "Email Updated!", "Your new email address has been verified and applied successfully.", "✓");
        } catch (error) {
            showResult("error", "Email Change Failed", "This email-change link is invalid, expired, or has already been used.", "!");
        }
    } else if (mode === "recoverEmail") {
        await handleRecoverEmail();
    } else if (mode === "resetPassword") {
        await handleResetPasswordForm();
    } else {
        showResult(
            "error",
            "Unsupported Action",
            "This type of Firebase account action is not currently supported by this page.",
            "!"
        );
    }
}

run();
</script>

</body>
</html>
