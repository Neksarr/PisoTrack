<!doctype html><html><head><script>if(localStorage.getItem("pisotrackDark")==="true")document.documentElement.classList.add("dark");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PisoTrack - Profile</title><link rel="icon" href="pisotrack.png"><link rel="stylesheet" href="mobile.css?v=20260818-5"><style>
*{box-sizing:border-box}
:root{--blue:#4d6d87;--light-blue:#8cb3d2;--page:#eef1f4;--card:#fff;--cream:#fbfbf7;--text:#111;--muted:#747b82;--border:#dfe4e7}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--text)}
html.dark body,body.dark{--page:#17191c;--card:#23262a;--cream:#2c3035;--text:#f5f5f5;--muted:#b7bcc2;--border:#3a3f45}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--blue);color:#fff;padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px}.brand img{width:48px;height:48px;object-fit:contain;border-radius:10px}.brand h1{margin:0;font-size:25px}
.nav-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;margin-bottom:8px;color:#fff;text-decoration:none;font-weight:bold}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.16)}.nav-item img{width:25px;height:25px;object-fit:contain;filter:brightness(0) invert(1)}
.sidebar-bottom{margin-top:auto;font-size:12px;opacity:.8;padding:10px 16px}
.main{padding:30px 36px 45px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.topbar h2{margin:0;font-size:30px}
.user-box{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:bold;text-decoration:none}.user-box img{width:40px;height:40px;object-fit:contain}
.panel{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 5px 18px rgba(0,0,0,.05)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel-head h3{margin:0;font-size:22px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}.btn.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue)}.btn.danger{background:#a64040}
.input,.select{width:100%;height:48px;border:1px solid var(--border);background:var(--cream);color:var(--text);border-radius:12px;padding:0 14px;font-size:15px;outline:none}
label{display:block;font-weight:bold;margin:12px 0 7px}.message{display:none;padding:11px 13px;border-radius:10px;margin:0 0 14px;font-size:14px}.message.show{display:block}.message.error{background:#ffe6e6;color:#8a1f1f}.message.success{background:#e4f6e9;color:#176235}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}.modal.open{display:flex}
.modal-box{width:min(520px,100%);background:var(--card);color:var(--text);border-radius:20px;padding:24px;max-height:92vh;overflow:auto}.modal-box h3{margin:0 0 12px;font-size:24px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:34px}.status{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:24px}}
.profile-wrap{width:100%;margin-inline:auto}.topbar>.user-box{transition:transform .18s ease,filter .18s ease}.topbar>.user-box:hover,.topbar>.user-box:focus-visible{transform:scale(1.08);filter:brightness(1.08)}.wide-pattern{background-color:#7faed1!important}
.secure-value>img{margin-left:auto}
.profile-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}.profile-actions #editInfo{grid-column:1;grid-row:1}.profile-actions #forgotPassword{display:block!important;grid-column:2;grid-row:1}.profile-actions #clearTx{grid-column:1;grid-row:2}.profile-actions #logout{grid-column:2;grid-row:2}.wide-pattern{transition:transform .18s ease,filter .18s ease}.wide-pattern:hover,.wide-pattern:focus-visible{transform:scale(1.06);filter:brightness(1.08)}@media(max-width:950px){.profile-actions{grid-template-columns:1fr!important}.profile-actions #editInfo,.profile-actions #clearTx,.profile-actions #forgotPassword,.profile-actions #logout{display:block!important;grid-column:auto;grid-row:auto}}
.secure-value .icon-button{margin-left:auto;width:38px;height:38px;border:0;border-radius:10px;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;transition:background .18s ease,transform .18s ease}.secure-value .icon-button img{width:26px;height:26px;object-fit:contain}.secure-value>img{width:38px!important;height:38px;padding:6px;border-radius:10px;object-fit:contain;transition:background .18s ease,transform .18s ease}.secure-value .icon-button:hover,.secure-value .icon-button:focus-visible,.secure-value>img:hover{background:rgba(140,179,210,.28);transform:scale(1.08)}.password-value{letter-spacing:2px}.confirm-help{margin:0 0 12px;color:var(--muted);font-size:14px}
.layout{grid-template-columns:1fr!important}.sidebar{display:flex!important;position:fixed!important;inset:0 auto 0 0!important;width:250px;height:100vh;z-index:100;transform:translateX(-100%);transition:transform .24s ease;box-shadow:8px 0 24px rgba(0,0,0,.18)}.sidebar.menu-open{transform:translateX(0)}.menu-toggle{position:fixed;top:18px;left:18px;z-index:110;width:48px;height:48px;padding:10px;border:0;border-radius:12px;background:var(--blue);cursor:pointer;transition:transform .18s ease,filter .18s ease,left .24s ease;box-shadow:0 4px 14px rgba(0,0,0,.18)}.menu-toggle:hover{transform:scale(1.14);filter:brightness(1.1)}.menu-toggle img{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1)}body.nav-open .menu-toggle{left:266px}.menu-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease}.menu-overlay.open{opacity:1;visibility:visible}.topbar{padding-left:58px}@media(max-width:520px){body.nav-open .menu-toggle{left:calc(100% - 62px)}.sidebar{width:min(250px,calc(100% - 72px))}.topbar{padding-left:54px}}

.profile-wrap{max-width:860px}.profile-card{background:var(--card);border-radius:20px;padding:28px}.info-grid{display:grid;grid-template-columns:180px 1fr;gap:18px 24px;align-items:center}.info-label{font-weight:bold}.secure-value{display:flex;align-items:center;gap:10px;background:var(--cream);padding:13px 15px;border-radius:12px}.secure-value img{width:26px;cursor:pointer}.profile-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.wide-pattern{background-image:url('tab3.png');background-size:cover;background-position:center;color:#fff;border:0;border-radius:14px;min-height:58px;font-size:16px;font-weight:bold;cursor:pointer}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><img src="pisotrack.png" alt=""><h1>PisoTrack</h1></div><a class="nav-item" href="index.html"><img src="homeicon.png" alt="">Home</a><a class="nav-item" href="transactions.html"><img src="purchaseicon.png" alt="">Transactions</a><a class="nav-item" href="reports.html"><img src="reporticon.png" alt="">Reports</a><a class="nav-item" href="settings.html"><img src="settingicon.png" alt="">Settings</a><div class="sidebar-bottom">PisoTrack Desktop</div></aside>
<main class="main"><div class="topbar"><h2>Profile</h2><a class="user-box" href="index.html">← Back to Home</a></div><div class="profile-wrap"><section class="profile-card"><div class="info-grid"><div class="info-label">Name:</div><div id="nameValue">Loading...</div><div class="info-label">Email Address:</div><div class="secure-value"><span id="emailValue">••••••</span><img id="emailEye" src="eyeofficon.png"></div><div class="info-label">Password:</div><div class="secure-value"><span>••••••••</span><span style="color:var(--muted);font-size:12px">Firebase passwords cannot be displayed.</span></div></div></section><div class="profile-actions"><button id="editInfo" class="wide-pattern">Edit Info</button><button id="clearTx" class="wide-pattern">Clear my Transactions</button><button id="forgotPassword" type="button" class="wide-pattern">Forgot Password</button><button id="logout" class="wide-pattern">Logout</button></div></div></main></div>
<div class="modal" id="editModal"><div class="modal-box"><h3>Edit Info</h3><div id="msg" class="message"></div><label>Name</label><input id="editName" class="input"><label>Email Address</label><input id="editEmail" class="input" type="email"><label>Current Password</label><input id="currentPassword" class="input" type="password" placeholder="Required for email/password changes"><label>New Password</label><input id="newPassword" class="input" type="password" placeholder="Leave blank to keep current password"><div class="modal-actions"><button id="cancelEdit" class="btn secondary">Cancel</button><button id="saveEdit" class="btn">Save Changes</button></div></div></div>
<script>(function(){function init(){const button=document.createElement("button"),overlay=document.createElement("div"),sidebar=document.querySelector(".sidebar");if(!sidebar)return;button.className="menu-toggle";button.type="button";button.setAttribute("aria-label","Open navigation menu");button.setAttribute("aria-expanded","false");button.innerHTML='<img src="3lines.png" alt="">';overlay.className="menu-overlay";document.body.prepend(overlay);document.body.prepend(button);function setMenu(open){sidebar.classList.toggle("menu-open",open);overlay.classList.toggle("open",open);document.body.classList.toggle("nav-open",open);button.setAttribute("aria-expanded",String(open));button.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu")}button.addEventListener("click",()=>setMenu(!sidebar.classList.contains("menu-open")));overlay.addEventListener("click",()=>setMenu(false));sidebar.querySelectorAll("a").forEach(link=>link.addEventListener("click",()=>setMenu(false)));document.addEventListener("keydown",event=>{if(event.key==="Escape")setMenu(false)})}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init()})();</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut,updateProfile,updatePassword,verifyBeforeUpdateEmail,EmailAuthProvider,reauthenticateWithCredential,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv2m_ciaohvHg7xCqkSWeTM_TfiphzMqw",
  authDomain: "pisotrack-e61d6.firebaseapp.com",
  projectId: "pisotrack-e61d6",
  storageBucket: "pisotrack-e61d6.firebasestorage.app",
  messagingSenderId: "492013865042",
  appId: "1:492013865042:web:e0ccf6e2bee76aab32f78b"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
function safeEmailKey(email){return String(email||"guest").replaceAll("@","_at_").replaceAll(".","_dot_").replaceAll("+","_plus_")}
function transactionKey(email){return "transactions_"+safeEmailKey(email)}
function normalizeTransactions(raw){if(Array.isArray(raw))return raw;if(typeof raw==="string"){try{const p=JSON.parse(raw);return Array.isArray(p)?p:[]}catch(e){return []}}return []}
function money(v,currency="PHP",rate=56.5){if(currency==="USD")return "$"+(Number(v||0)/rate).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});return "₱"+Number(v||0).toLocaleString("en-PH",{minimumFractionDigits:0,maximumFractionDigits:2})}
async function getAppData(user){const ref=doc(db,"users",user.uid,"appData","default"),snap=await getDoc(ref);return {ref,data:snap.exists()?snap.data():{}}}
async function getTransactions(user){const {data}=await getAppData(user);return normalizeTransactions(data[transactionKey(user.email)]??data[transactionKey(data.currentEmail)]??data.transactions)}
async function saveTransactions(user,list){const ref=doc(db,"users",user.uid,"appData","default");await setDoc(ref,{currentEmail:user.email,email:user.email,[transactionKey(user.email)]:JSON.stringify(list),updatedAt:Date.now()},{merge:true})}
async function getSettings(user){const {data}=await getAppData(user);return {currency:data.currency||"PHP",notifications:data.notifications!==false,dark:data.dark===true,phpPerUsd:typeof data.phpPerUsdNumber==="number"?data.phpPerUsdNumber:56.5}}
async function saveSettings(user,values){const ref=doc(db,"users",user.uid,"appData","default");await setDoc(ref,{...values,currentEmail:user.email,email:user.email,updatedAt:Date.now()},{merge:true})}
function applyDark(v){document.documentElement.classList.toggle("dark",!!v);if(document.body)document.body.classList.toggle("dark",!!v)}
function fmtDate(ms){return new Date(Number(ms)).toLocaleDateString("en-US",{month:"short",day:"2-digit",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

let user,shown=false,settings;function maskEmail(e){const at=e.indexOf("@");if(at<=1)return"••••"+e.substring(Math.max(0,at));return e[0]+"••••••"+e.substring(at)}
const profileActions=document.querySelector(".profile-actions");
let forgotPasswordButton=document.getElementById("forgotPassword");
if(!forgotPasswordButton){forgotPasswordButton=document.createElement("button");forgotPasswordButton.id="forgotPassword";forgotPasswordButton.type="button";forgotPasswordButton.className="wide-pattern";forgotPasswordButton.textContent="Forgot Password";profileActions.insertBefore(forgotPasswordButton,document.getElementById("logout"))}
forgotPasswordButton.style.setProperty("display","block","important");
document.body.insertAdjacentHTML("beforeend",'<div class="modal" id="forgotPasswordModal"><form class="modal-box" id="forgotPasswordForm"><h3>Forgot Password</h3><p class="confirm-help">Enter your email address and PisoTrack will send you a secure password-reset link.</p><div id="forgotPasswordMessage" class="message" role="status"></div><label for="forgotPasswordEmail">Email Address</label><input id="forgotPasswordEmail" class="input" type="email" required autocomplete="email"><div class="modal-actions"><button id="cancelForgotPassword" class="btn secondary" type="button">Cancel</button><button id="sendResetEmail" class="btn" type="submit">Send Email</button></div></form></div>');
const forgotPasswordModal=document.getElementById("forgotPasswordModal"),forgotPasswordForm=document.getElementById("forgotPasswordForm"),forgotPasswordEmail=document.getElementById("forgotPasswordEmail"),forgotPasswordMessage=document.getElementById("forgotPasswordMessage"),sendResetEmail=document.getElementById("sendResetEmail"),cancelForgotPassword=document.getElementById("cancelForgotPassword");
forgotPasswordButton.onclick=()=>{forgotPasswordForm.reset();forgotPasswordEmail.disabled=false;sendResetEmail.hidden=false;forgotPasswordEmail.value=user?.email||"";forgotPasswordMessage.className="message";forgotPasswordMessage.textContent="";forgotPasswordModal.classList.add("open");forgotPasswordEmail.focus()};
cancelForgotPassword.onclick=()=>forgotPasswordModal.classList.remove("open");
forgotPasswordModal.onclick=event=>{if(event.target===forgotPasswordModal)forgotPasswordModal.classList.remove("open")};
forgotPasswordForm.onsubmit=async event=>{event.preventDefault();const email=forgotPasswordEmail.value.trim();if(!email)return;sendResetEmail.disabled=true;try{await sendPasswordResetEmail(auth,email,{url:new URL("login.html",location.href).href});forgotPasswordMessage.textContent="Email received. Check your inbox and click the secure PisoTrack reset link.";forgotPasswordMessage.className="message show success";forgotPasswordEmail.disabled=true;sendResetEmail.hidden=true}catch(error){forgotPasswordMessage.textContent="Unable to send the reset email. Check the address and try again.";forgotPasswordMessage.className="message show error"}finally{sendResetEmail.disabled=false}};
const passwordLabel=[...document.querySelectorAll(".info-label")].find(label=>label.textContent.trim()==="Password:");
const passwordRow=passwordLabel?.nextElementSibling;
if(passwordRow)passwordRow.innerHTML='<span id="passwordValue" class="password-value">••••••••</span><button id="passwordEye" class="icon-button" type="button" aria-label="Show password"><img src="eyeofficon.png" alt=""></button>';
document.body.insertAdjacentHTML("beforeend",'<div class="modal" id="passwordModal"><form class="modal-box" id="passwordConfirmForm"><h3>Confirm Password</h3><p class="confirm-help">Enter your current password to reveal it.</p><div id="passwordConfirmMessage" class="message error" role="alert"></div><label for="passwordConfirmInput">Current Password</label><input id="passwordConfirmInput" class="input" type="password" required autocomplete="current-password"><div class="modal-actions"><button id="cancelPasswordConfirm" class="btn secondary" type="button">Cancel</button><button id="confirmPassword" class="btn" type="submit">Confirm</button></div></form></div>');
const passwordValue=document.getElementById("passwordValue"),passwordEye=document.getElementById("passwordEye"),passwordEyeImage=passwordEye?.querySelector("img");
const passwordModal=document.getElementById("passwordModal"),passwordConfirmForm=document.getElementById("passwordConfirmForm"),passwordConfirmInput=document.getElementById("passwordConfirmInput"),passwordConfirmMessage=document.getElementById("passwordConfirmMessage"),confirmPassword=document.getElementById("confirmPassword"),cancelPasswordConfirm=document.getElementById("cancelPasswordConfirm");
let passwordShown=false;
function hidePassword(){passwordShown=false;passwordValue.textContent="••••••••";passwordEyeImage.src="eyeofficon.png";passwordEye.setAttribute("aria-label","Show password")}
passwordEye.onclick=()=>{if(passwordShown){hidePassword();return}passwordConfirmForm.reset();passwordConfirmMessage.classList.remove("show");passwordModal.classList.add("open");passwordConfirmInput.focus()};
cancelPasswordConfirm.onclick=()=>passwordModal.classList.remove("open");
passwordModal.onclick=event=>{if(event.target===passwordModal)passwordModal.classList.remove("open")};
passwordConfirmForm.onsubmit=async event=>{event.preventDefault();const entered=passwordConfirmInput.value;if(!user||!entered)return;confirmPassword.disabled=true;try{const credential=EmailAuthProvider.credential(user.email,entered);await reauthenticateWithCredential(user,credential);passwordValue.textContent=entered;passwordShown=true;passwordEyeImage.src="eyeshowicon.png";passwordEye.setAttribute("aria-label","Hide password");passwordConfirmInput.value="";passwordConfirmMessage.className="message error";passwordModal.classList.remove("open")}catch(error){passwordConfirmMessage.textContent="The password is incorrect. Please try again.";passwordConfirmMessage.className="message show error"}finally{confirmPassword.disabled=false}};
emailEye.onclick=()=>{shown=!shown;emailValue.textContent=shown?user.email:maskEmail(user.email);emailEye.src=shown?"eyeshowicon.png":"eyeofficon.png"};
editInfo.onclick=()=>{editName.value=user.displayName||"";editEmail.value=user.email||"";currentPassword.value="";newPassword.value="";editModal.classList.add("open")};cancelEdit.onclick=()=>editModal.classList.remove("open");
saveEdit.onclick=async()=>{try{const newName=editName.value.trim(),newEmail=editEmail.value.trim(),cp=currentPassword.value,np=newPassword.value;if(!newName||!newEmail)return;const emailChanged=newEmail!==user.email,passChanged=!!np,nameChanged=newName!==(user.displayName||"");if(passChanged&&np.length<8)throw new Error("New password must be at least 8 characters.");if(emailChanged||passChanged){if(!cp)throw new Error("Enter your current password first.");const cred=EmailAuthProvider.credential(user.email,cp);await reauthenticateWithCredential(user,cred)}if(nameChanged)await updateProfile(user,{displayName:newName});if(passChanged)await updatePassword(user,np);if(emailChanged)await verifyBeforeUpdateEmail(user,newEmail,{url:new URL("login.html",location.href).href});await setDoc(doc(db,"users",user.uid),{uid:user.uid,name:newName,email:user.email},{merge:true});nameValue.textContent=newName;emailValue.textContent=shown?user.email:maskEmail(user.email);if(emailChanged){msg.textContent="Verification sent to your new email address. Your account email will change after you verify it.";msg.className="message show success";editEmail.value=user.email;currentPassword.value="";newPassword.value=""}else{editModal.classList.remove("open")}}catch(e){msg.textContent=e.message||"Unable to update profile.";msg.className="message show error"}};
clearTx.onclick=async()=>{if(await window.pisoTrackConfirm({title:"Clear Transactions?",message:"Are you sure you want to clear all of your transactions? This action cannot be undone.",confirmText:"Clear",danger:true})){await saveTransactions(user,[]);alert("Transactions cleared.")}};logout.onclick=async()=>{if(!await window.pisoTrackConfirm({title:"Log Out?",message:"Are you sure you want to log out?",confirmText:"Log Out"}))return;await signOut(auth);location.href="login.html"};
onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";if(!u.emailVerified){await signOut(auth);return location.href="login.html"}user=u;await setDoc(doc(db,"users",u.uid),{uid:u.uid,name:u.displayName||"User",email:u.email},{merge:true});try{settings=await getSettings(u);localStorage.setItem("pisotrackDark",String(settings.dark));applyDark(settings.dark)}catch(error){console.error(error);settings={currency:"PHP",notifications:true,dark:document.documentElement.classList.contains("dark"),phpPerUsd:56.5}}nameValue.textContent=u.displayName||"User";emailValue.textContent=maskEmail(u.email||"")});
</script></body></html>
