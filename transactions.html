<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PisoTrack - Transactions</title><link rel="icon" href="pisotrack.png"><style>
*{box-sizing:border-box}
:root{--blue:#4d6d87;--light-blue:#8cb3d2;--page:#eef1f4;--card:#fff;--cream:#fbfbf7;--text:#111;--muted:#747b82;--border:#dfe4e7}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--text)}
body.dark{--page:#17191c;--card:#23262a;--cream:#2c3035;--text:#f5f5f5;--muted:#b7bcc2;--border:#3a3f45}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--blue);color:#fff;padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:40px}.brand img{width:48px;height:48px;object-fit:contain;border-radius:10px}.brand h1{margin:0;font-size:25px}
.nav-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;margin-bottom:8px;color:#fff;text-decoration:none;font-weight:bold}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.16)}.nav-item img{width:25px;height:25px;object-fit:contain;filter:brightness(0) invert(1)}
.sidebar-bottom{margin-top:auto;font-size:12px;opacity:.8;padding:10px 16px}
.main{padding:30px 36px 45px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.topbar h2{margin:0;font-size:30px}
.user-box{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:bold;text-decoration:none}.user-box img{width:40px;height:40px;object-fit:contain}
.panel{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 5px 18px rgba(0,0,0,.05)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel-head h3{margin:0;font-size:22px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}.btn.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue)}.btn.danger{background:#a64040}
.input,.select{width:100%;height:48px;border:1px solid var(--border);background:var(--cream);color:var(--text);border-radius:12px;padding:0 14px;font-size:15px;outline:none}
label{display:block;font-weight:bold;margin:12px 0 7px}.message{display:none;padding:11px 13px;border-radius:10px;margin:0 0 14px;font-size:14px}.message.show{display:block}.message.error{background:#ffe6e6;color:#8a1f1f}.message.success{background:#e4f6e9;color:#176235}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}.modal.open{display:flex}
.modal-box{width:min(520px,100%);background:var(--card);color:var(--text);border-radius:20px;padding:24px;max-height:92vh;overflow:auto}.modal-box h3{margin:0 0 12px;font-size:24px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:34px}.status{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:950px){.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:24px}}
.field-hidden{display:none}
.actions{flex-direction:row-reverse}.actions .btn,.actions .btn.secondary{background:var(--blue);border:1px solid var(--blue);color:#fff}.actions .btn:hover,.actions .btn.secondary:hover{filter:brightness(1.08)}
.layout{grid-template-columns:1fr!important}.sidebar{display:flex!important;position:fixed!important;inset:0 auto 0 0!important;width:250px;height:100vh;z-index:100;transform:translateX(-100%);transition:transform .24s ease;box-shadow:8px 0 24px rgba(0,0,0,.18)}.sidebar.menu-open{transform:translateX(0)}.menu-toggle{position:fixed;top:18px;left:18px;z-index:110;width:48px;height:48px;padding:10px;border:0;border-radius:12px;background:var(--blue);cursor:pointer;transition:transform .18s ease,filter .18s ease,left .24s ease;box-shadow:0 4px 14px rgba(0,0,0,.18)}.menu-toggle:hover{transform:scale(1.14);filter:brightness(1.1)}.menu-toggle img{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1)}body.nav-open .menu-toggle{left:266px}.menu-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease}.menu-overlay.open{opacity:1;visibility:visible}.topbar{padding-left:58px}@media(max-width:520px){body.nav-open .menu-toggle{left:calc(100% - 62px)}.sidebar{width:min(250px,calc(100% - 72px))}.topbar{padding-left:54px}}

.filters{display:grid;grid-template-columns:180px 220px 1fr auto;gap:12px;align-items:center;margin-bottom:20px}.balance-chip{background:var(--blue);color:#fff;padding:14px 18px;border-radius:12px;font-weight:bold;text-align:center}.tx-row{display:grid;grid-template-columns:1fr 150px 90px;gap:14px;align-items:center;background:var(--cream);padding:15px 16px;border-radius:14px;margin-bottom:10px}.tx-title{font-weight:bold}.tx-date{font-size:12px;color:var(--muted);margin-top:4px}.tx-amount{font-weight:bold;text-align:right}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:18px}@media(max-width:1050px){.filters{grid-template-columns:1fr 1fr}.tx-row{grid-template-columns:1fr 110px 80px}}</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><img src="pisotrack.png" alt=""><h1>PisoTrack</h1></div><a class="nav-item" href="index.html"><img src="homeicon.png" alt="">Home</a><a class="nav-item active" href="transactions.html"><img src="purchaseicon.png" alt="">Transactions</a><a class="nav-item" href="reports.html"><img src="reporticon.png" alt="">Reports</a><a class="nav-item" href="settings.html"><img src="settingicon.png" alt="">Settings</a><div class="sidebar-bottom">PisoTrack Desktop</div></aside>
<main class="main"><div class="topbar"><h2>Transactions</h2><a class="user-box" href="users.html"><img src="profileicon.png"><span id="userName">User</span></a></div><div class="filters"><select id="category" class="select"><option>All</option></select><select id="range" class="select"><option>This Month</option><option>Last 3 Months</option><option>Last 6 Months</option><option>Last Year</option></select><div id="filterLabel" class="status"></div><div id="net" class="balance-chip">₱0</div></div><section class="panel"><div id="list"><div class="empty">Loading...</div></div><div class="actions"><button class="btn secondary" id="addExpense">+ Add Expense</button><button class="btn" id="addIncome">+ Add Income</button></div></section></main></div>
<div class="modal" id="modal"><div class="modal-box"><h3 id="modalTitle">Add Transaction</h3><label>Title</label><input id="txTitle" class="input"><label>Category</label><input id="txCategory" class="input"><label>Amount</label><input id="txAmount" class="input" type="number" step="0.01"><label>Date</label><input id="txDate" class="input" type="date"><div class="modal-actions"><button class="btn secondary" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div></div></div>
<script src="logout.js" defer></script>
<script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBv2m_ciaohvHg7xCqkSWeTM_TfiphzMqw",
  authDomain: "pisotrack-e61d6.firebaseapp.com",
  projectId: "pisotrack-e61d6",
  storageBucket: "pisotrack-e61d6.firebasestorage.app",
  messagingSenderId: "492013865042",
  appId: "1:492013865042:web:e0ccf6e2bee76aab32f78b"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
function safeEmailKey(email){return String(email||"guest").replaceAll("@","_at_").replaceAll(".","_dot_").replaceAll("+","_plus_")}
function transactionKey(email){return "transactions_"+safeEmailKey(email)}
function normalizeTransactions(raw){if(Array.isArray(raw))return raw;if(typeof raw==="string"){try{const p=JSON.parse(raw);return Array.isArray(p)?p:[]}catch(e){return []}}return []}
function money(v,currency="PHP",rate=56.5){if(currency==="USD")return "$"+(Number(v||0)/rate).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});return "₱"+Number(v||0).toLocaleString("en-PH",{minimumFractionDigits:0,maximumFractionDigits:2})}
async function getAppData(user){const ref=doc(db,"users",user.uid,"appData","default"),snap=await getDoc(ref);return {ref,data:snap.exists()?snap.data():{}}}
async function getTransactions(user){const {data}=await getAppData(user);return normalizeTransactions(data[transactionKey(user.email)]??data[transactionKey(data.currentEmail)]??data.transactions)}
async function saveTransactions(user,list){const ref=doc(db,"users",user.uid,"appData","default");await setDoc(ref,{currentEmail:user.email,email:user.email,[transactionKey(user.email)]:JSON.stringify(list),updatedAt:Date.now()},{merge:true})}
async function getSettings(user){const {data}=await getAppData(user);return {currency:data.currency||"PHP",notifications:data.notifications!==false,dark:data.dark===true,phpPerUsd:typeof data.phpPerUsdNumber==="number"?data.phpPerUsdNumber:56.5}}
async function saveSettings(user,values){const ref=doc(db,"users",user.uid,"appData","default");await setDoc(ref,{...values,currentEmail:user.email,email:user.email,updatedAt:Date.now()},{merge:true})}
function applyDark(v){document.body.classList.toggle("dark",!!v)}
function fmtDate(ms){return new Date(Number(ms)).toLocaleDateString("en-US",{timeZone:"Asia/Manila",month:"short",day:"2-digit",year:"numeric"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function phtDateValue(date=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit"}).format(date)}function phtTimestamp(value){return new Date(value+"T12:00:00+08:00").getTime()}

let currentUser,allTx=[],settings,editingIndex=-1,currentType="expense";
range.innerHTML='<option>All</option><option>Today</option><option>Last Week</option><option>This Week</option><option>This Month</option><option>Last Month</option><option>Last 3 Months</option><option>This Year</option>';range.value="All";
function rangeBounds(){const[y,m,d]=phtDateValue().split("-").map(Number),dayMs=86400000,phtOffset=8*60*60*1000,today=Date.UTC(y,m-1,d),weekDay=(new Date(today).getUTCDay()+6)%7,thisWeek=today-weekDay*dayMs,toPht=calendarUtc=>calendarUtc-phtOffset;switch(range.value){case"Today":return[toPht(today),toPht(today+dayMs)];case"This Week":return[toPht(thisWeek),toPht(thisWeek+7*dayMs)];case"Last Week":return[toPht(thisWeek-7*dayMs),toPht(thisWeek)];case"This Month":return[toPht(Date.UTC(y,m-1,1)),toPht(Date.UTC(y,m,1))];case"Last Month":return[toPht(Date.UTC(y,m-2,1)),toPht(Date.UTC(y,m-1,1))];case"Last 3 Months":return[toPht(Date.UTC(y,m-3,1)),toPht(Date.UTC(y,m,1))];case"This Year":return[toPht(Date.UTC(y,0,1)),toPht(Date.UTC(y+1,0,1))];default:return[-Infinity,Infinity]}}
function filtered(){const[start,end]=rangeBounds();return allTx.map((t,i)=>({...t,_i:i})).filter(t=>Number(t.time)>=start&&Number(t.time)<end&&(category.value==="All"||String(t.category).toLowerCase()===category.value.toLowerCase()))}
function render(){const f=filtered();let inc=0,exp=0;f.forEach(t=>t.type==="income"?inc+=Number(t.amount):exp+=Number(t.amount));net.textContent=money(inc-exp,settings.currency,settings.phpPerUsd);filterLabel.textContent=range.value+(category.value==="All"?"":" • "+category.value);list.innerHTML=f.length?f.slice().reverse().map(t=>`<div class="tx-row"><div><div class="tx-title">${esc(t.title)} • ${esc(t.category)}</div><div class="tx-date">${fmtDate(t.time)}</div></div><div class="tx-amount">${t.type==="income"?"+":"-"}${money(t.amount,settings.currency,settings.phpPerUsd)}</div><button class="btn secondary edit" data-i="${t._i}">Edit</button></div>`).join(""):'<div class="empty">No transactions for this filter.</div>';document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.i)))}
function fillCategories(){const cats=[...new Set(allTx.map(t=>t.category).filter(Boolean))].sort();category.innerHTML='<option>All</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("")}
const incomeCategories=["Salary","Allowance","Business","Freelance","Bonus","Gift","Scholarship","Investment","Refund","Other Income"],expenseCategories=["Food","Transportation","School","Bills","Shopping","Entertainment","Health","Rent","Utilities","Internet / Load","Personal Care","Family","Pet Expenses","Debt / Loan","Other Expense"];
const oldCategoryInput=document.getElementById("txCategory"),txCategorySelect=document.createElement("select");txCategorySelect.id="txCategory";txCategorySelect.className="select";oldCategoryInput.replaceWith(txCategorySelect);const otherCategoryField=document.createElement("div");otherCategoryField.className="field-hidden";otherCategoryField.innerHTML='<label>Specify category</label><input id="txOtherCategory" class="input" maxlength="50">';txCategorySelect.insertAdjacentElement("afterend",otherCategoryField);const txOtherCategory=document.getElementById("txOtherCategory");
function setTxCategories(type,value){const choices=type==="income"?incomeCategories:expenseCategories;txCategorySelect.innerHTML=choices.map(item=>`<option>${esc(item)}</option>`).join("");if(value&&!choices.includes(value)){txCategorySelect.insertAdjacentHTML("beforeend",`<option>${esc(value)}</option>`)}txCategorySelect.value=value||choices[0];toggleOtherCategory()}
function toggleOtherCategory(){const other=txCategorySelect.value==="Other Income"||txCategorySelect.value==="Other Expense";otherCategoryField.classList.toggle("field-hidden",!other);txOtherCategory.required=other;if(!other)txOtherCategory.value=""}
txCategorySelect.onchange=toggleOtherCategory;
function openAdd(type){editingIndex=-1;currentType=type;modalTitle.textContent=type==="income"?"Add Income":"Add Expense";txTitle.value="";setTxCategories(type);txAmount.value="";txDate.value=phtDateValue();modal.classList.add("open")}
function openEdit(i){editingIndex=i;const t=allTx[i];currentType=t.type;modalTitle.textContent="Edit Transaction";txTitle.value=t.title;setTxCategories(t.type,t.category);if(t.category==="Other Income"||t.category==="Other Expense")txOtherCategory.value=t.category;txAmount.value=settings.currency==="USD"?(Number(t.amount)/settings.phpPerUsd).toFixed(2):Number(t.amount).toFixed(2);txDate.value=phtDateValue(new Date(Number(t.time)));modal.classList.add("open")}
addExpense.onclick=()=>openAdd("expense");addIncome.onclick=()=>openAdd("income");cancel.onclick=()=>modal.classList.remove("open");category.onchange=render;range.onchange=render;
save.onclick=async()=>{const amount=Number(txAmount.value),isOther=txCategorySelect.value.startsWith("Other "),selectedCategory=isOther?txOtherCategory.value.trim():txCategorySelect.value;if(!txTitle.value.trim()||!selectedCategory||!amount||!txDate.value)return;const php=settings.currency==="USD"?amount*settings.phpPerUsd:amount;const item={title:txTitle.value.trim(),category:selectedCategory,amount:php,type:currentType,time:phtTimestamp(txDate.value)};if(editingIndex>=0)allTx[editingIndex]=item;else allTx.push(item);await saveTransactions(currentUser,allTx);modal.classList.remove("open");fillCategories();render()};
onAuthStateChanged(auth,async user=>{if(!user)return location.href="login.html";if(!user.emailVerified){await signOut(auth);return location.href="login.html"}currentUser=user;userName.textContent=user.displayName||user.email;settings=await getSettings(user);applyDark(settings.dark);allTx=await getTransactions(user);fillCategories();render()});
</script><script>(function(){const button=document.createElement("button"),overlay=document.createElement("div"),sidebar=document.querySelector(".sidebar");if(!sidebar)return;button.className="menu-toggle";button.type="button";button.setAttribute("aria-label","Open navigation menu");button.setAttribute("aria-expanded","false");button.innerHTML='<img src="3lines.png" alt="">';overlay.className="menu-overlay";document.body.prepend(overlay);document.body.prepend(button);function setMenu(open){sidebar.classList.toggle("menu-open",open);overlay.classList.toggle("open",open);document.body.classList.toggle("nav-open",open);button.setAttribute("aria-expanded",String(open));button.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu")}button.addEventListener("click",()=>setMenu(!sidebar.classList.contains("menu-open")));overlay.addEventListener("click",()=>setMenu(false));sidebar.querySelectorAll("a").forEach(link=>link.addEventListener("click",()=>setMenu(false)));document.addEventListener("keydown",event=>{if(event.key==="Escape")setMenu(false)})})();</script></body></html>
